name: "Mail Archiver"
version: "1.0.0"
slug: mail_archiver
description: >-
  Lokales E-Mail-Archiv mit Weboberfläche.
  Speichert Mails von Gmail, GMX und anderen IMAP-Konten dauerhaft auf dem Home Assistant.
url: "https://github.com/YOUR_USERNAME/ha-mail-archiver"
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 5000
ingress_entry: /
panel_icon: mdi:email-multiple-outline
panel_title: Mail Archiver
startup: application
boot: auto
hassio_api: true
auth_api: true
ports:
  5000/tcp: null
map:
  - type: data
    read_only: false
options:
  admin_username: admin
  admin_password: changeme
  timezone: Europe/Berlin
  db_host: core-postgresql
  db_port: 5432
  db_name: MailArchiver
  db_user: mailuser
  db_password: ""
schema:
  admin_username: str
  admin_password: password
  timezone: str
  db_host: str
  db_port: port
  db_name: str
  db_user: str
  db_password: password
