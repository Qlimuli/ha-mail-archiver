name: "Mail Archiver"
version: "1.2.3"
slug: mail_archiver
description: >-
  Lokales E-Mail-Archiv mit integriertem ClamAV-Virenschutz (Menüpunkt nur für Admins).
url: "https://github.com/Qlimuli/ha-mail-archiver"
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 5000
panel_icon: mdi:email-multiple-outline
panel_title: Mail
startup: services
boot: auto
ports:
  5000/tcp: 5000
map:
  - type: data
    read_only: false
options:
  admin_username: admin
  admin_password: changeme
  timezone: Europe/Berlin
  use_external_db: false
  db_host: ""
  db_port: 5432
  db_name: MailArchiver
  db_user: mailuser
  db_password: ""
  security_virus_scan: true
  security_quarantine: true
  security_update_signatures_on_start: true
  security_scan_on_start: true
  security_scan_interval_minutes: 60
  security_block_dangerous_extensions: true
  security_dangerous_extensions: "exe,dll,bat,cmd,com,scr,ps1,vbs,vbe,js,jse,wsf,wsh,msi,msp,hta,cpl,inf,reg,jar,iso,img,vhd,lnk"
schema:
  admin_username: str
  admin_password: password
  timezone: str
  use_external_db: bool
  db_host: str
  db_port: port
  db_name: str
  db_user: str
  db_password: password
  security_virus_scan: bool
  security_quarantine: bool
  security_update_signatures_on_start: bool
  security_scan_on_start: bool
  security_scan_interval_minutes: int(0,1440)
  security_block_dangerous_extensions: bool
  security_dangerous_extensions: str
