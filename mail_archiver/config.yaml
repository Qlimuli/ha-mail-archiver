name: "Mail Archiver"
version: "1.1.6"
slug: mail_archiver
description: >-
  Lokales E-Mail-Archiv mit Weboberfläche.
  Speichert Mails von Gmail, GMX und anderen IMAP-Konten im Add-on (eigene PostgreSQL-Datenbank).
url: "https://github.com/Qlimuli/ha-mail-archiver"
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 5000
panel_icon: mdi:email-multiple-outline
panel_title: Mail
startup: services
boot: auto
ports:
  5000/tcp: 5000
map:
  - type: data
    read_only: false
options:
  admin_username: admin
  admin_password: changeme
  timezone: Europe/Berlin
  use_external_db: false
  db_host: ""
  db_port: 5432
  db_name: MailArchiver
  db_user: mailuser
  db_password: ""
schema:
  admin_username: str
  admin_password: password
  timezone: str
  use_external_db: bool
  db_host: str
  db_port: port
  db_name: str
  db_user: str
  db_password: password
